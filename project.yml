name: MedJars
options:
  bundleIdPrefix: com.medjars
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  MedJars:
    type: application
    platform: iOS
    sources:
      - path: MedJars
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.medjars.app
        PRODUCT_NAME: MedJars
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: MedJars/MedJars.entitlements
    info:
      path: MedJars/Info.plist
      properties:
        CFBundleDisplayName: Med Jars
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSFaceIDUsageDescription: Med Jars uses Face ID to keep your medications and dose log private.
        NFCReaderUsageDescription: Med Jars reads the NFC tag on a jar to open that jar.
        com.apple.developer.nfc.readersession.iso7816.select-identifiers: [D2760000850101]
        CFBundleURLTypes:
          - CFBundleURLName: com.medjars.app
            CFBundleURLSchemes: [medjars]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: MedJars/MedJars.entitlements
      properties:
        com.apple.security.application-groups: [group.com.medjars.app]
        com.apple.developer.nfc.readersession.formats: [TAG]
    dependencies:
      - target: MedJarsWidget
    scheme: {}
  MedJarsWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.medjars.app.widget
        PRODUCT_NAME: MedJarsWidget
        CODE_SIGN_ENTITLEMENTS: Widget/MedJarsWidget.entitlements
        SKIP_INSTALL: YES
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Med Jars
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/MedJarsWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.medjars.app]
