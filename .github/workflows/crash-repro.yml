name: Crash repro

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repro:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Pick the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate project with UI tests
        run: |
          brew install xcodegen
          python3 ci/add_uitests.py
          xcodegen generate

      - name: Run UI tests
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Pro Max' not in x['name'] and 'Plus' not in x['name']]
          print(sorted(c,key=lambda x:x['name'])[-1]['udid'])")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark
          mkdir -p out
          xcodebuild test -project MedJars.xcodeproj -scheme MedJars -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath build \
            -resultBundlePath out/result.xcresult CODE_SIGNING_ALLOWED=NO > out/test.log 2>&1 || echo "TESTS FAILED" >> out/summary.txt
          grep -E "error:|STEP OK|Test Case|failed|crash|Crash|idle notification not received" out/test.log | head -150 >> out/summary.txt || true
          cat out/summary.txt

      - name: Collect crash reports
        if: always()
        run: |
          mkdir -p out/crashes
          find ~/Library/Logs/DiagnosticReports -iname "*MedJars*" -mmin -60 -exec cp {} out/crashes/ \; 2>/dev/null || true
          ls -la out/crashes
          DATA=$(xcrun simctl get_app_container "$UDID" com.medjars.app data 2>/dev/null || true)
          [ -n "$DATA" ] && cp "$DATA/Documents/medjars.json" out/medjars.json 2>/dev/null || true
          xcrun simctl spawn "$UDID" log show --last 20m --predicate 'process == "MedJars"' --style compact 2>/dev/null | grep -iE "fatal|crash|error|exception|terminat" | head -80 > out/applog.txt || true
          rm -rf out/result.xcresult
          tail -300 out/test.log > out/test-tail.log
          rm out/test.log

      - name: Save results to the ci-repro branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out || exit 0
          git init -q -b ci-repro
          git add -A
          git -c user.name="github-actions" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Crash repro ${{ github.run_number }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-repro
