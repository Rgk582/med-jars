name: Simulator preview

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Pick the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build for the simulator
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project MedJars.xcodeproj -scheme MedJars -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > sim.log 2>&1 \
            || (grep -E "error:" sim.log | sort -u | head -60; tail -40 sim.log; exit 1)

      - name: Run and screenshot
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Pro Max' not in x['name'] and 'Plus' not in x['name']]
          print(sorted(c,key=lambda x:x['name'])[-1]['udid'])")
          echo "Simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 || true
          APP=build/Build/Products/Debug-iphonesimulator/MedJars.app
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          xcrun simctl launch "$UDID" com.medjars.app; sleep 8
          xcrun simctl io "$UDID" screenshot shots/1-empty.png
          xcrun simctl terminate "$UDID" com.medjars.app || true
          python3 ci/make_demo.py demo.json
          DATA=$(xcrun simctl get_app_container "$UDID" com.medjars.app data)
          mkdir -p "$DATA/Documents" && cp demo.json "$DATA/Documents/medjars.json"
          GROUP=$(xcrun simctl get_app_container "$UDID" com.medjars.app group.com.medjars.app 2>/dev/null || true)
          if [ -n "$GROUP" ]; then mkdir -p "$GROUP" && cp demo.json "$GROUP/medjars.json"; echo "group: $GROUP"; fi
          xcrun simctl launch "$UDID" com.medjars.app; sleep 8
          xcrun simctl io "$UDID" screenshot shots/2-cabinet.png
          xcrun simctl openurl "$UDID" "medjars://jar/magnesium"; sleep 5
          xcrun simctl io "$UDID" screenshot shots/3-jar.png
          xcrun simctl ui "$UDID" appearance dark; sleep 3
          xcrun simctl io "$UDID" screenshot shots/4-jar-dark.png
          xcrun simctl openurl "$UDID" "medjars://jar/vitamin-d3"; sleep 4
          xcrun simctl io "$UDID" screenshot shots/5-jar-dark-2.png
          if xcrun simctl spawn "$UDID" launchctl list | grep -q "com.medjars.app"; then echo "APP RUNNING" > shots/status.txt; else echo "APP NOT RUNNING" > shots/status.txt; fi
          cat shots/status.txt
          xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "MedJars"' --style compact 2>/dev/null | grep -iE "fatal|crash|error" | head -40 > shots/log.txt || true

      - name: Save screenshots to the ci-previews branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd shots || exit 0
          git init -q -b ci-previews
          git add -A
          git -c user.name="github-actions" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Simulator preview ${{ github.run_number }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-previews
