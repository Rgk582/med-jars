name: Build IPA

on:
  push:
    branches: [main]
    paths-ignore:
      - "ci/**"
      - ".github/workflows/preview.yml"
      - ".github/workflows/crash-repro.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Pick the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set +e
          xcodebuild \
            -project MedJars.xcodeproj \
            -scheme MedJars \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          STATUS=$?
          echo "::group::Errors"
          grep -E "error:|fatal error" build.log | sort -u | head -80
          echo "::endgroup::"
          if [ $STATUS -ne 0 ]; then
            echo "BUILD FAILED"
            tail -60 build.log
            exit $STATUS
          fi

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/MedJars.app
          ls "$APP" "$APP/PlugIns"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry MedJars.ipa Payload
          ls -lh MedJars.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MedJars-ipa
          path: MedJars.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" MedJars.ipa \
            --title "Med Jars build ${{ github.run_number }}" \
            --notes "Unsigned app file. Sign and install it with your certificate in Feather, ESign or Sideloadly." \
            --latest
